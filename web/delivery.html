<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>FoodieHub - Delivery Tracking</title>
</head>

<body>

<h2>🚚 FoodieHub Delivery</h2>

<label>Enter Order ID:</label>
<input type="number" id="orderId" placeholder="Example: 205">

<button onclick="startDelivery()">Start Delivery</button>

<p id="status">Enter an order ID to start.</p>

<script>

const status = document.getElementById("status");

let socket = null;
let orderId = null;

function startDelivery() {

    orderId = document.getElementById("orderId").value;

    if (!orderId) {
        status.innerText = "Please enter an Order ID ❌";
        return;
    }

    status.innerText = "Connecting...";

    const protocol =
        location.protocol === "https:" ? "wss://" : "ws://";

    socket = new WebSocket(
        protocol + location.host + "/location"
    );

    socket.onopen = function () {

        status.innerText =
            "WebSocket connected ✅\n" +
            "Tracking Order #" + orderId;

        startLocationSharing();
    };

    socket.onclose = function () {

        status.innerText =
            "WebSocket disconnected ❌";
    };

    socket.onerror = function () {

        status.innerText =
            "WebSocket error ❌";
    };
}


function startLocationSharing() {

    if (!navigator.geolocation) {

        status.innerText =
            "GPS is not supported ❌";

        return;
    }

    navigator.geolocation.watchPosition(

        function (position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;


            const locationData = {

                orderId: orderId,
                latitude: latitude,
                longitude: longitude

            };


            if (socket.readyState === WebSocket.OPEN) {

                socket.send(
                    JSON.stringify(locationData)
                );

                status.innerText =
                    "Location sharing active 📍\n\n" +
                    "Order: #" + orderId + "\n" +
                    "Latitude: " + latitude + "\n" +
                    "Longitude: " + longitude;
            }

        },

        function (error) {

            status.innerText =
                "Please allow location permission ❌";

            console.log(error);
        },

        {

            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 10000

        }
    );
}

</script>

</body>
</html>
